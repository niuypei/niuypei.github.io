<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$page_title</title>
  <meta name="description" content="$description">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="$canonical">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/crimson-pro-regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/css/minimal-light.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrapper">
    <header class="profile">
      $portrait
      <h1>$name</h1>
      <p class="research-focus">$focus</p>
      $email
      <div class="profile-links">$profile_links</div>
      <nav class="section-nav" aria-label="On this page">$navigation</nav>
    </header>
    <main id="main" class="content" tabindex="-1">
      <section id="about" class="content-section" aria-labelledby="about-title">
        <h2 id="about-title">About Me</h2>
        $about
      </section>
      <section id="research" class="content-section" aria-labelledby="research-title">
        <h2 id="research-title">Research Interests</h2>
        <ul class="research-list">$research_interests</ul>
      </section>
      $publications
      $education
      $projects
      $awards
      <footer class="site-footer">
        <span>© $name</span>
        <span>Based on <a href="https://github.com/yaoyao-liu/minimal-light">Minimal Light</a>.</span>
      </footer>
    </main>
  </div>
</body>
</html>
